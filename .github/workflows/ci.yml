# BlinkStay CI
# Runs on every pull request into main, every push to main,
# and by hand from the Actions tab ("Run workflow").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- BACKEND: compile + all tests ----------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest # has Docker, so Testcontainers can start Postgres
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # *Test classes run in Surefire, *IT classes (Spring + Postgres container) in Failsafe
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  # ---------------- FRONTEND: install + lint + build ----------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # TEMPORARY: lint reports errors but does not fail the job.
      # Remove "continue-on-error" once backlog item 12 (frontend lint) is merged.
      - name: Lint (not blocking yet)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
