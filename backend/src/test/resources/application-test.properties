# ============================================================
# TEST profile: automated tests only (laptop and GitHub Actions).
# Activated by @IntegrationTest (@ActiveProfiles("test")).
# FAKE values only. Never put a real secret here.
#
# Rule: every property in application.properties that has no default
# (${X} without ":") needs a value here, or the test app cannot start.
# ============================================================

# --- Database ---
# No URL, user or password here: the PostgreSQL container from
# PostgresContainerConfig supplies them (@ServiceConnection), so tests
# can never touch your local DB or Aiven.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- Fake config for external services (tests never call them) ---
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
app.cloudinary.folder-prefix=test
# JWTUtil uses the UTF-8 bytes of this value: needs 32+ characters
jwt.signature=test-only-jwt-secret-for-blinkstay-automated-tests-0123456789
mapbox.access-token=test-mapbox-token
app.cookie.max-age=86400
app.cors.allowed-origins=http://localhost:5173

# Emails: never sent, never written to disk
app.mail.enabled=false
app.mail.transport=smtp
app.mail.preview-dir=

# Payments: mock gateway only
app.payment.provider=mock

# --- No seeding, no Cloudinary jobs ---
blinkstay.seed.enabled=false
blinkstay.seed.reverse-geocode=false
blinkstay.seed.reviews.enabled=false
listing.cloudinary-cleanup.enabled=false
auth.cloudinary-cleanup.enabled=false
listing.cloudinary-orphan-cleanup.enabled=false
listing.cloudinary-orphan-cleanup.dry-run=true

# --- Quiet output ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.root=warn
logging.level.com.blinkstay=info
# shows "Creating container for image: postgres:18-alpine" so you can see Docker work
logging.level.org.testcontainers=info