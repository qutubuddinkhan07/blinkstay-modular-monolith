# Production profile (set SPRING_PROFILE=prod)

# Tables are created and updated from the entities, same as development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger off
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=info
logging.level.com.blinkstay=info
logging.level.org.springframework.security=warn

# Database pool: Aiven free allows 20 connections; keep 2 warm so requests skip a new TLS handshake
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000

# Cookie: the Netlify proxy makes /api same-site, so Lax is enough and safer than None
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Exact frontend URL(s), comma separated. No default on purpose.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Demo listings on a fresh database: set SEED_ENABLED=true once, then remove it
blinkstay.seed.enabled=${SEED_ENABLED:false}
blinkstay.seed.reverse-geocode=${SEED_REVERSE_GEOCODE:false}

# demo reviews; idempotent, safe to leave on
blinkstay.seed.reviews.enabled=${SEED_REVIEWS:false}

# Cloudinary: production's own folders (prod/...); cleanup jobs off, dry run if ever enabled
app.cloudinary.folder-prefix=${CLOUDINARY_FOLDER_PREFIX:prod}
listing.cloudinary-orphan-cleanup.enabled=${CLOUDINARY_ORPHAN_CLEANUP:false}
listing.cloudinary-orphan-cleanup.dry-run=true

# Mock payments in production only with this explicit demo flag
app.payment.allow-mock-in-prod=${ALLOW_MOCK_PAYMENTS:false}

# First admin, used only when no admin exists yet (needs a password of 10+ characters)
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:Admin}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}