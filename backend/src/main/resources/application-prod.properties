# Production profile (set SPRING_PROFILE=prod)

# Tables are created and updated from the entities, same as development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger off
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=info
logging.level.blinkstay=info
logging.level.org.springframework.security=warn


# Cookie: SameSite=None + Secure is needed when frontend and backend are on different sites
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}

# Exact frontend URL(s), comma separated. Set when you deploy, no default on purpose.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Demo listings on the first deploy: set SEED_ENABLED=true once, then remove it
blinkstay.seed.enabled=${SEED_ENABLED:false}
blinkstay.seed.reverse-geocode=${SEED_REVERSE_GEOCODE:false}

# First admin, used only when no admin exists yet (needs a password of 10+ characters)
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:Admin}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}