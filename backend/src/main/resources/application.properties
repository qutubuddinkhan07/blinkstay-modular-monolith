spring.application.name=backend

# Server Configuration
server.port=8080

# Load .env from local development
spring.config.import=optional:file:.env[.properties]

# PROFILE Configuration
spring.profiles.active=${SPRING_PROFILE}

# LOCAL-DATABASE CONFIGURATION
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Handling multipart files
# Maximum size allowed for a single uploaded file
spring.servlet.multipart.max-file-size=10MB
# Maximum total request size allowed for multipart/form-data
spring.servlet.multipart.max-request-size=10MB

# CLOUDINARY CONFIGURATION
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}

# JWT CONFIGURATION
# "your-super-secret-key-that-is-at-least-32-characters-long!"
jwt.signature=${JWT_SECRET}

# Mapbox Access Token
mapbox.access-token=${MAPBOX_ACCESS_TOKEN}

# COOKIE CONFIGURATION
app.cookie.name=BLINKSTAY_TOKEN
app.cookie.max-age=${MAX_AGE}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# NOTIFICATION CONFIGURATION

# false = emails are printed to the console, true = sent through SMTP
app.mail.enabled=${MAIL_ENABLED}
app.support.email=support@blinkstay.com
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100

# EMAIL CONFIGURATION
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.socketFactory.port=465

# BOOKING SERVICE
app.booking.hold-minutes=15
app.booking.max-nights=30
app.booking.max-advance-days=365
app.booking.free-cancellation-hours=48
app.booking.currency=INR
app.booking.zone=Asia/Kolkata
app.booking.max-pending-per-guest=2

# PAYMENT SERVICE
#app.payment.provider=mock
app.payment.provider=${PAYMENT_PROVIDER}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

app.booking.complete-interval-ms=20000