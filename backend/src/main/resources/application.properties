spring.application.name=backend

# Server Configuration (Render/Cloud Run set PORT; local default 8090)
server.port=${PORT:8090}

# Load .env from local development
spring.config.import=optional:file:.env[.properties]

# PROFILE Configuration
spring.profiles.active=${SPRING_PROFILE}

# DATABASE CONFIGURATION
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Load lazy collections (amenities, roles...) for many rows in one query instead of one per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Handling multipart files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CLOUDINARY CONFIGURATION
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}

# JWT CONFIGURATION (secret of at least 32 characters, from the environment)
jwt.signature=${JWT_SECRET}

# Mapbox Access Token
mapbox.access-token=${MAPBOX_ACCESS_TOKEN}

# COOKIE CONFIGURATION
app.cookie.name=BLINKSTAY_TOKEN
app.cookie.max-age=${MAX_AGE}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# NOTIFICATION CONFIGURATION
# false = emails are printed to the console, true = sent (see app.mail.transport)
app.mail.enabled=${MAIL_ENABLED}
# real inbox that receives replies and is shown in the email footer
app.support.email=${SUPPORT_EMAIL:support@blinkstay.com}
# From address; leave MAIL_FROM_ADDRESS empty to use MAIL_USERNAME
app.mail.from=${MAIL_FROM_ADDRESS:}
app.mail.from-name=BlinkStay
# public PNG logo URL (Cloudinary); empty = maroon "B" tile drawn in HTML
app.mail.logo-url=${MAIL_LOGO_URL:}
# console mode only: folder where each email is saved as .html; empty = off
app.mail.preview-dir=${MAIL_PREVIEW_DIR:}
# base URL used by the buttons inside emails
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100

# EMAIL CONFIGURATION (SMTP, used when app.mail.transport=smtp)
spring.mail.host=${MAIL_HOST:smtp.zoho.in}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.socketFactory.port=465

# smtp (local) or zoho-api (HTTPS; for hosts that block mail ports, e.g. Render free)
app.mail.transport=${MAIL_TRANSPORT:smtp}
app.mail.zoho.accounts-url=${ZOHO_ACCOUNTS_URL:https://accounts.zoho.in}
app.mail.zoho.api-url=${ZOHO_MAIL_API_URL:https://mail.zoho.in}
app.mail.zoho.client-id=${ZOHO_CLIENT_ID:}
app.mail.zoho.client-secret=${ZOHO_CLIENT_SECRET:}
app.mail.zoho.refresh-token=${ZOHO_REFRESH_TOKEN:}
app.mail.zoho.account-id=${ZOHO_ACCOUNT_ID:}

# BOOKING SERVICE
app.booking.hold-minutes=15
app.booking.max-nights=30
app.booking.max-advance-days=365
app.booking.free-cancellation-hours=48
app.booking.currency=INR
app.booking.zone=Asia/Kolkata
app.booking.max-pending-per-guest=2
# how often finished stays are marked COMPLETED (1 hour)
app.booking.complete-interval-ms=3600000

# PAYMENT SERVICE
app.payment.provider=${PAYMENT_PROVIDER:mock}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# EARNINGS
app.earnings.commission-percent=10
app.earnings.currency=INR
# how often stays are marked as earned (1 hour)
app.earnings.earn-interval-ms=3600000