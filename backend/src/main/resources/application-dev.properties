# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging Configuration
logging.level.root=info
logging.level.com.blinkstay=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.sql=DEBUG
logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.org.springframework.security=debug
logging.level.org.springframework.cache=debug

# Enable ANSI colored output in terminal/console
spring.output.ansi.enabled=ALWAYS

# seeding 
blinkstay.seed.enabled=true
blinkstay.seed.reverse-geocode=true
blinkstay.seed.reverse-geocode-delay-ms=120

# System.currentTimeMillis() + 1000 * 60 * 60 * 24

# Cloudinary cleanup
listing.cloudinary-cleanup.enabled=true
listing.cloudinary-cleanup.folder=blinkstay_listings

auth.cloudinary-cleanup.enabled=true
auth.cloudinary-cleanup.folder=blinkstay_user_profiles
