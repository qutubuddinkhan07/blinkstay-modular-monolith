# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.blinkstay=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate.sql=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate.type.descriptor.sql=trace

# Enable ANSI colored output in terminal/console
spring.output.ansi.enabled=ALWAYS

# seeding 
blinkstay.seed.enabled=${SEEDING}

# Cookie Configuration
app.cookie.name=BLINKSTAY_TOKEN
app.cookie.max-age=86400
app.cookie.secure=false
app.cookie.same-site=Lax

# System.currentTimeMillis() + 1000 * 60 * 60 * 24