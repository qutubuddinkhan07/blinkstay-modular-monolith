# Development profile (set SPRING_PROFILE=dev)

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.level.root=info
logging.level.blinkstay=debug
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.sql=DEBUG
logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.org.springframework.security=debug
logging.level.org.springframework.cache=debug

# CORS: local dev servers and tunnels
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://*.devtunnels.ms,https://*.ngrok-free.app,https://*.ngrok.io,https://*.trycloudflare.com

# Coloured console output
spring.output.ansi.enabled=ALWAYS

# Seeding (only runs when the listings table is empty)
blinkstay.seed.enabled=true
blinkstay.seed.reverse-geocode=true
blinkstay.seed.reverse-geocode-delay-ms=120

# Cloudinary: this environment's own folders (dev/...)
app.cloudinary.folder-prefix=dev

# Startup wipe of the DEV folders when the tables are empty (dev profile only).
# Keep false unless you really want to empty dev/blinkstay_... on a fresh database.
listing.cloudinary-cleanup.enabled=false
auth.cloudinary-cleanup.enabled=false

# Nightly orphan cleanup: off; when on, dry run first
listing.cloudinary-orphan-cleanup.enabled=false
listing.cloudinary-orphan-cleanup.dry-run=true