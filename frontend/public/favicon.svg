<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BlinkStay">
  <style>
    .tile  { fill: #710019; }
    .spark { fill: #ff7a9c; }
    @media (prefers-color-scheme: dark) {
      .tile  { fill: #ff2768; }
      .spark { fill: #ffffff; }
    }
  </style>

  <rect class="tile" width="64" height="64" rx="15" />

  <!-- the "B" -->
  <path
    d="M22 16V48M22 16H33a8 8 0 0 1 0 16H22M22 32H35a8 8 0 0 1 0 16H22"
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- the "blink" spark -->
  <path class="spark" d="M51 8l1.7 4.3L57 14l-4.3 1.7L51 20l-1.7-4.3L45 14l4.3-1.7z" />
</svg>